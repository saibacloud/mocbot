services:
  mocbot:
    build:
      context: .
      args:
        OLLAMA_HOST: ${OLLAMA_HOST:-http://192.168.1.243:11434}
        OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    image: mocbot:latest
    container_name: mocbot
    restart: unless-stopped
    ports:
      - "8100:8000"
    environment:
      OLLAMA_HOST:
      OLLAMA_MODEL:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
